services:
  - type: web
    name: terratea-api
    runtime: node
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    plan: free
    envVars:
      - key: DATABASE_URL
        sync: false

  - type: web
    name: terratea-web
    runtime: static
    rootDir: terratea-web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false

